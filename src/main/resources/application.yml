# Reducido (18-sep-2026): mismo patrón que ms-mascotas y ms-alertas — el
# application.yml local queda solo con spring.application.name + spring.config.import,
# TODO lo demás (eureka, management, info) vive en
# sanos-y-salvos-config_server/config/discovery-server.yml.
spring:
  application:
    name: discovery-server
  config:
    # Import obligatorio: si el Config Server no responde, el servicio falla al arrancar (y Docker lo reinicia)
    # en vez de levantar con los valores por defecto de Spring (puerto 8080, sin registro) pareciendo sano.
    import: ${SPRING_CONFIG_IMPORT:configserver:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
