services:
  discovery-server:
    build: .
    container_name: sanos-discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - sanos-y-salvos-network

networks:
  sanos-y-salvos-network:
    # La crea config-server (external: false ahí); acá solo nos unimos.
    external: true
    name: sanos-y-salvos-network
